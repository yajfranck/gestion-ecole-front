<section #region popover="manual" aria-label="Notifications"
  class="toast-region fixed inset-auto right-4 top-4 m-0 w-[calc(100%_-_2rem)] max-w-sm overflow-visible border-0 bg-transparent p-0 text-left [overflow-wrap:anywhere] sm:right-6 sm:top-6">
  <div class="flex flex-col gap-3">
    @for (item of toast.notifications(); track item.id) {
      <article class="toast-card flex items-start gap-3 rounded-xl border bg-white p-4 shadow-lg"
        [class.toast-success]="item.type === 'success'" [class.toast-error]="item.type === 'error'"
        [class.toast-info]="item.type === 'info'" [class.toast-warning]="item.type === 'warning'"
        [attr.role]="item.type === 'error' ? 'alert' : 'status'" aria-atomic="true"
        (mouseenter)="toast.pause(item.id)" (mouseleave)="toast.resume(item.id)"
        (focusin)="toast.pause(item.id, 'focus')" (focusout)="onFocusOut($event, item.id)">
        <span class="toast-icon grid size-9 shrink-0 place-items-center rounded-lg" aria-hidden="true">
          <svg class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            @switch (item.type) {
              @case ('success') { <circle cx="12" cy="12" r="9" /><path d="m8 12 3 3 5-6" /> }
              @case ('error') { <circle cx="12" cy="12" r="9" /><path d="m9 9 6 6m0-6-6 6" /> }
              @case ('warning') { <path d="m12 3 10 18H2L12 3Zm0 6v4m0 4h.01" /> }
              @default { <circle cx="12" cy="12" r="9" /><path d="M12 11v6m0-10h.01" /> }
            }
          </svg>
        </span>
        <div class="min-w-0 flex-1 pt-0.5">
          <p class="text-sm font-semibold text-[#26372d]">{{ item.title }}</p>
          <p class="mt-1 text-sm leading-5 text-[#69756d]">{{ item.message }}</p>
        </div>
        <button class="-mr-1 -mt-1 grid size-9 shrink-0 place-items-center rounded-lg text-[#69756d] transition hover:bg-[#f3f5f2] hover:text-[#26372d] focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#47745d]"
          type="button" [attr.aria-label]="'Fermer la notification : ' + item.title" (click)="toast.dismiss(item.id)">
          <svg class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18" /></svg>
        </button>
      </article>
    }
  </div>
</section>
