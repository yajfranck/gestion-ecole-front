<app-dialog [title]="title()" [returnFocusTo]="trigger()" (dismiss)="resolved.emit(false)">
  <p class="px-5 py-6 text-sm leading-6 text-[#35473b] sm:px-6">{{ message() }}</p>
  <footer class="flex flex-col-reverse gap-2 border-t border-[#e9ede8] bg-[#f8faf7] px-5 py-4 sm:flex-row sm:justify-end sm:px-6">
    <button type="button" class="btn btn-secondary" autofocus (click)="resolved.emit(false)">Annuler</button>
    <button type="button" class="btn btn-primary" (click)="resolved.emit(true)">Confirmer</button>
  </footer>
</app-dialog>
