<dialog
  #dialog
  [attr.aria-labelledby]="headingId"
  class="dialog-surface [overflow-wrap:anywhere] m-auto max-h-[90dvh] w-[calc(100%_-_2rem)] overflow-y-auto overscroll-contain rounded-xl border border-[#e1e7e0] bg-white p-0 text-[#26372d] shadow-xl backdrop:bg-[#13291f]/50"
  [class.max-w-xl]="size() === 'default'"
  [class.max-w-3xl]="size() === 'wide'"
  [class.max-w-5xl]="size() === 'extra-wide'"
  (cancel)="cancel($event)"
>
  <header
    class="flex items-start justify-between gap-3 border-b border-[#e1e7e0] px-4 py-4 sm:px-6"
  >
    <h2 [id]="headingId" class="section-title min-w-0">{{ title() }}</h2>
    <button
      class="btn btn-secondary shrink-0"
      type="button"
      aria-label="Fermer la fenêtre"
      (click)="cancel()"
      [disabled]="busy()"
    >
      Fermer
    </button>
  </header>
  <ng-content />
</dialog>
