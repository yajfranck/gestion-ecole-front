<section class="mx-auto max-w-xl">
  <header class="mb-6">
    <h1 class="text-xl font-semibold text-[#26372d]">Modifier mon mot de passe</h1>
    <p class="mt-2 text-sm leading-6 text-[#69756d]">Saisissez votre mot de passe actuel, puis choisissez un nouveau mot de passe d’au moins 12 caractères. Vous devrez vous reconnecter après sa modification.</p>
  </header>

  <form class="rounded-xl border border-[#e1e7e0] bg-white p-5 sm:p-6" (ngSubmit)="submit()">
    <div class="space-y-4">
      <label class="block text-sm font-medium text-[#35473b]" for="currentPassword">Mot de passe actuel
        <input class="mt-1.5 min-h-11 w-full rounded-lg border border-[#d7ddd6] px-3 text-sm" id="currentPassword" name="currentPassword" type="password" autocomplete="current-password" [(ngModel)]="currentPassword" required>
      </label>
      <label class="block text-sm font-medium text-[#35473b]" for="newPassword">Nouveau mot de passe
        <input class="mt-1.5 min-h-11 w-full rounded-lg border border-[#d7ddd6] px-3 text-sm" id="newPassword" name="newPassword" type="password" autocomplete="new-password" [(ngModel)]="newPassword" required minlength="12">
      </label>
      <label class="block text-sm font-medium text-[#35473b]" for="confirmPassword">Confirmer le nouveau mot de passe
        <input class="mt-1.5 min-h-11 w-full rounded-lg border border-[#d7ddd6] px-3 text-sm" id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" [(ngModel)]="confirmPassword" required>
      </label>
    </div>

    @if (errorMessage()) {
      <p class="mt-4 rounded-lg border border-[#e8c4b6] bg-[#fff4ef] px-4 py-3 text-sm leading-5 text-[#8a3e2d]" role="alert">{{ errorMessage() }}</p>
    }

    <div class="mt-6 flex flex-wrap gap-3">
      <button class="min-h-10 rounded-lg bg-[#244a37] px-4 text-sm font-semibold text-white hover:bg-[#193b2b] disabled:cursor-wait disabled:opacity-60" type="submit" [disabled]="isSubmitting()">
        {{ isSubmitting() ? 'Modification…' : 'Modifier le mot de passe' }}
      </button>
      <a class="inline-flex min-h-10 items-center rounded-lg border border-[#dfe5de] px-4 text-sm font-semibold text-[#35473b] no-underline hover:bg-[#f5f8f4]" routerLink="/dashboard">Annuler</a>
    </div>
  </form>
</section>
