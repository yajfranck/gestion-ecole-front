<section class="page mx-auto max-w-xl">
  <header class="page-header">
    <div>
      <h1 class="page-heading">Modifier mon mot de passe</h1>
      <p class="page-subtitle">Saisissez votre mot de passe actuel, puis choisissez-en un nouveau d’au moins 12 caractères. Vous devrez vous reconnecter après la modification.</p>
    </div>
  </header>

  <form class="form-grid rounded-xl border border-[#e1e7e0] bg-white md:grid-cols-1" (ngSubmit)="submit()" [attr.aria-busy]="isSubmitting()">
    <label class="form-field">
      <span class="form-label is-required">Mot de passe actuel</span>
      <input class="form-control" id="currentPassword" name="currentPassword" type="password" autocomplete="current-password" [(ngModel)]="currentPassword" required>
    </label>
    <label class="form-field">
      <span class="form-label is-required">Nouveau mot de passe</span>
      <input class="form-control" id="newPassword" name="newPassword" type="password" autocomplete="new-password" [(ngModel)]="newPassword" required minlength="12">
      <span class="form-hint">Au moins 12 caractères (72 octets au maximum).</span>
    </label>
    <label class="form-field">
      <span class="form-label is-required">Confirmer le nouveau mot de passe</span>
      <input class="form-control" id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" [(ngModel)]="confirmPassword" required>
    </label>

    @if (errorMessage()) {
      <p class="form-error" role="alert">{{ errorMessage() }}</p>
    }

    <p class="form-legend">* Champ obligatoire</p>
    <div class="form-actions">
      <a class="btn btn-secondary no-underline" routerLink="/dashboard">Annuler</a>
      <button class="btn btn-primary" type="submit" [disabled]="isSubmitting()">{{ isSubmitting() ? 'Modification…' : 'Modifier le mot de passe' }}</button>
    </div>
  </form>
</section>
