<section>
  <nav class="mb-3 text-sm text-[#758178]" aria-label="Fil d’Ariane">
    <a class="text-[#47745d] no-underline hover:text-[#244a37]" routerLink="/establishments">Établissements</a>
    <span class="px-2" aria-hidden="true">/</span>
    <span class="text-[#35473b]">{{ establishmentName() || 'Espace établissement' }}</span>
  </nav>
  <h1 class="sr-only">{{ establishmentName() || 'Établissement' }}</h1>
  @if (licenseRegistered()) {
    <p class="mb-4 border-l-4 border-[#47745d] bg-[#eef7f0] p-4 text-sm text-[#28563b]" role="status">La licence de l’établissement a été enregistrée.</p>
  }

  @if (isLoading()) {
    <div class="h-36 animate-pulse rounded-xl border border-[#e1e7e0] bg-white" aria-label="Chargement de l’établissement"></div>
  } @else if (errorMessage()) {
    <div class="flex flex-col items-start gap-4 rounded-xl border border-[#e8c4b6] bg-[#fff4ef] p-5 sm:flex-row sm:items-center sm:justify-between" role="alert">
      <p class="text-sm leading-6 text-[#8a3e2d]">{{ errorMessage() }}</p>
      <button class="text-sm font-semibold text-[#8a3e2d] underline underline-offset-4" type="button" (click)="load()">Réessayer</button>
    </div>
  } @else {
    <router-outlet />
  }
</section>
