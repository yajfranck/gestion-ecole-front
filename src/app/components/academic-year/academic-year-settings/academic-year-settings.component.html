<section class="section" aria-labelledby="year-settings-title">
  <div class="section-header">
    <h2 id="year-settings-title" class="section-title">Informations de l’année scolaire</h2>
  </div>
  <form class="form-grid" (ngSubmit)="save()" [attr.aria-busy]="isSaving() || isArchiving()">
    <p class="form-title"><span>Modification de l’année</span><span class="form-mode">Modification</span></p>
    <label class="form-field form-field-wide">
      <span class="form-label is-required">Nom de l’année</span>
      <input class="form-control md:max-w-md" id="settings-year-name" name="settingsYearName" [(ngModel)]="name" maxlength="100" required>
    </label>
    <div class="form-row">
      <label class="form-field form-field-compact">
        <span class="form-label is-required">Date de début</span>
        <input class="form-control" id="settings-year-start" name="settingsStartsOn" type="date" [(ngModel)]="startsOn" [max]="endsOn" required>
      </label>
      <label class="form-field form-field-compact">
        <span class="form-label is-required">Date de fin</span>
        <input class="form-control" id="settings-year-end" name="settingsEndsOn" type="date" [(ngModel)]="endsOn" [min]="startsOn" required>
        <span class="form-hint">Les dates doivent encore contenir toutes les périodes actives.</span>
      </label>
    </div>
    @if (errorMessage()) {
      <p class="form-error" role="alert">{{ errorMessage() }}</p>
    }
    @if (successMessage()) {
      <output class="form-success">{{ successMessage() }}</output>
    }
    <p class="form-legend">* Champ obligatoire</p>
    <div class="form-actions sm:justify-between">
      <button class="btn btn-danger" type="button" [disabled]="isArchiving() || isSaving()" (click)="archive()">{{ isArchiving() ? 'Archivage…' : 'Archiver l’année' }}</button>
      <button class="btn btn-primary" type="submit" [disabled]="isSaving() || isArchiving()">{{ isSaving() ? 'Enregistrement…' : 'Enregistrer' }}</button>
    </div>
  </form>
</section>
