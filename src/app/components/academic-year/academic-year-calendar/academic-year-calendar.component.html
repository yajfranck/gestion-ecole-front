@if (year(); as current) {
  <div class="page">
    <app-academic-year-settings [establishmentId]="current.establishmentId" [year]="current" (updated)="onYearUpdated($event)" (archived)="onYearArchived()" />
    <app-academic-period-list [establishmentId]="current.establishmentId" [academicYearId]="current.id" [yearStartsOn]="current.startsOn" [yearEndsOn]="current.endsOn" />
  </div>
}
