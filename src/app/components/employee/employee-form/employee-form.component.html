<details class="form-panel" open>
  <summary>Inviter un membre du personnel</summary>
  <form class="form-grid" (ngSubmit)="invite()" [attr.aria-busy]="isSaving()">
    @if (positions().length === 0 && !isLoadingPositions()) {
      <p class="form-error">Créez d’abord un poste actif dans l’onglet Postes.</p>
    }
    @if (positionError()) {
      <p class="form-error" role="alert">{{ positionError() }}</p>
    }
    <fieldset class="form-row min-w-0 border-0 p-0">
      <legend class="form-title mb-3">Identité</legend>
      <label class="form-field">
        <span class="form-label is-required">Prénom</span>
        <input class="form-control" name="firstName" [(ngModel)]="firstName" required>
      </label>
      <label class="form-field">
        <span class="form-label is-required">Nom</span>
        <input class="form-control" name="lastName" [(ngModel)]="lastName" required>
      </label>
      <label class="form-field form-field-wide">
        <span class="form-label is-required">Adresse e-mail</span>
        <input class="form-control md:max-w-md" name="email" type="email" [(ngModel)]="email" required>
        <span class="form-hint">L’invitation pour définir le mot de passe est envoyée à cette adresse.</span>
      </label>
    </fieldset>
    <fieldset class="form-row min-w-0 border-0 p-0">
      <legend class="form-title mb-3">Affectation</legend>
      <label class="form-field form-field-compact">
        <span class="form-label is-required">Matricule</span>
        <input class="form-control font-mono" name="employeeNumber" [(ngModel)]="employeeNumber" maxlength="40" required>
      </label>
      <label class="form-field">
        <span class="form-label is-required">Poste</span>
        <select class="form-control" name="positionId" [(ngModel)]="positionId" required [disabled]="positions().length === 0">
          <option value="" disabled>Choisir un poste</option>
          @for (position of positions(); track position.id) { <option [value]="position.id">{{ position.name }}</option> }
        </select>
      </label>
    </fieldset>
    @if (errorMessage()) { <p class="form-error" role="alert">{{ errorMessage() }}</p> }
    <p class="form-legend">* Champ obligatoire</p>
    <div class="form-actions">
      <button class="btn btn-primary" type="submit" [disabled]="isSaving() || positions().length === 0">{{ isSaving() ? 'Envoi en cours…' : 'Envoyer l’invitation' }}</button>
    </div>
  </form>
</details>
